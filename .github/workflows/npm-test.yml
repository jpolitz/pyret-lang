name: Test pyret-npm CLI

on:
  workflow_dispatch:
  push:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build pyret-lang
        working-directory: ./lang
        run: |
          npm ci
          make phaseA libA

      - name: Stage the build that pyret.js loads
        working-directory: ./npm
        run: |
          mkdir -p pyret-lang/build
          cp -r ../lang/build/phaseA pyret-lang/build/

      - name: Test the CLI against that build
        working-directory: ./npm
        run: |
          npm ci
          npm test
