name: lang/ tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lang

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: install
      run: make install

    - name: build
      run: make

    - name: run tests
      run: make all-pyret-test

  ts-suite:
    name: Pyret test suite, compiled by the TS compiler

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lang

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: install
      run: make install

    - name: build TypeScript compiler
      run: make ts-compiler

    # The .arr-compiled counterpart of this suite is the `build` job's
    # `make all-pyret-test`: same tests/all.arr (main2 + type-check +
    # regression + lib-test), built and run through build/ts-compiler.
    - name: run tests
      run: make all-ts-pyret-test

    # The npm CLI's compile-server path (`pyret --backend ts`): -serve mode
    # driven over the npm client's ws+unix protocol -- compile / failure /
    # reconnect / shutdown, and the served standalone must run.
    - name: compile-server test
      run: make ts-serve-test

  vm-suite:
    name: Pyret test suite, run by the interpreter back end

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lang

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: install
      run: make install

    - name: build TypeScript compiler
      run: make ts-compiler

    # The opcode table and bytecode format are stated once for the emitter
    # and once for the machine; this asserts they agree, and verifies every
    # emitted instruction stream with the disassembler.
    - name: unit tests
      run: make vm-unit-test

    # Every parity program built BOTH ways with the same front end, output
    # required identical. Since parsing/scope/desugar/ANF/type-check are
    # shared, a difference here is a back-end difference.
    - name: back-end parity
      run: make vm-parity-test

    # The same tests/all.arr the `build` and `ts-suite` jobs run, this time
    # with every module -- trove included -- executed as bytecode.
    - name: run tests
      run: make all-vm-pyret-test

    # stdin, exit codes and network imports: the pauseStack path, which on
    # the machine means suspending and resuming an interpreted stack.
    - name: io tests
      run: make vm-io-test

    # The npm CLI's `pyret --backend vm` compile server, including
    # running the standalone it produces.
    - name: compile-server test
      run: make vm-serve-test

  bootstrap-converge:
    name: bootstrap convergence (.arr == TS, byte-identical)

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lang

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: install
      run: make install

    - name: build TypeScript compiler
      run: make ts-compiler

    # Builds both bootstrap chains and asserts all four standalones are one
    # byte-identical fixpoint: phaseB==phaseC (.arr self-fixpoint),
    # phaseB-ts==phaseC-ts (TS self-fixpoint), phaseB==phaseB-ts (the TS
    # compiler is a byte-exact drop-in for the Pyret-hosted compiler).
    - name: converge
      run: make bootstrap-converge

    # Runs here because this job has already built both compilers (phaseA is
    # a prerequisite of the phaseB chain). Compiles the whole tests/type-check
    # corpus with -type-check under both and requires identical diagnostics --
    # the direct coverage for type-check.ts, which the ts-suite job's tests
    # never execute (they import the .arr type checker).
    - name: type-check parity
      run: make ts-type-check-parity

    # Same rationale, for well-formedness/scope errors: the corpus is the
    # inline programs of the in-suite wf tests, extracted at runtime.
    - name: well-formedness parity
      run: make ts-wf-parity

