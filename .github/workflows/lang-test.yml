name: lang/ tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lang

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: install
      run: make install

    - name: build
      run: make

    - name: run tests
      run: make all-pyret-test

    # Re-run the regression suite with a very low trampoline run-gas so
    # continuations are captured aggressively. This surfaces JS<->Pyret call
    # sites that mishandle a captured continuation (see make-check-context).
    # Regression has no runtime compilation, so the cost is negligible; the
    # value lives in the REGRESSION_RUNGAS Makefile variable.
    - name: run regression tests at low run-gas
      run: make regression-test-lowgas

