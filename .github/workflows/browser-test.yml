name: browser-test (embed + vscode webviews)

# Runs code.pyret.org's editor assertions against several environments via the
# single runner in browser-test/:
#   cpo         -- the reference (/editor, Chromium)
#   webkit      -- /editor in Playwright's bundled WebKit (Linux, fast smoke)
#   embed       -- the embed API's embedded instance
#   vscode      -- the pyret-parley.cpo webview (headless VS Code for the Web)
#   vscode-ovsx -- the same webview, but with its assets served the way Open VSX
#                  / the GitLab Web IDE serve them (text/plain + nosniff + size
#                  cap) -- the reproduction of pyret-parley issue #21
#   ios-safari  -- /editor in REAL Safari on a pinned iOS Simulator (macos-14)
#
# Shape: build code.pyret.org + the extension ONCE, then fan out the Linux
# environments as a parallel matrix (each on its own runner, so chart rendering
# doesn't contend for CPU), with ios-safari as its own macOS job off the same
# build.

on:
  push:
    tags-ignore:
      - automated*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build code.pyret.org web assets
        working-directory: ./code.pyret.org
        run: |
          ln -s ../lang pyret
          cd ../lang && npm install && make phaseA-deps
          cd ../code.pyret.org
          npm ci --ignore-scripts
          npm run build

      - name: Build vscode extension
        working-directory: ./vscode
        # --ignore-scripts: compiling needs only webpack/ts-loader, but a devDep
        # (@vscode/test-web -> @playwright/browser-chromium) would otherwise
        # download a ~150MB Chromium in postinstall, which the build doesn't use.
        run: |
          ln -sf ../code.pyret.org/build build
          npm ci --ignore-scripts
          npm run compile

      # /editor + the embed host page are served from code.pyret.org/build;
      # the vscode webview's assets are self-contained in vscode/dist.
      - uses: actions/upload-artifact@v4
        with:
          name: cpo-build
          path: code.pyret.org/build
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-dist
          path: vscode/dist
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        env: [cpo, webkit, embed, vscode, vscode-ovsx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # cpo + embed load /editor from the CPO server; vscode does not.
      - name: Restore cpo build
        if: ${{ !startsWith(matrix.env, 'vscode') }}
        uses: actions/download-artifact@v4
        with:
          name: cpo-build
          path: code.pyret.org/build
      - name: Restore vscode extension
        if: ${{ startsWith(matrix.env, 'vscode') }}
        uses: actions/download-artifact@v4
        with:
          name: vscode-dist
          path: vscode/dist

      - name: Install browser-test deps + browser
        working-directory: ./browser-test
        # --ignore-scripts skips the implicit @playwright/browser-chromium and
        # playwright browser downloads from npm ci; we then install exactly one
        # browser (with OS deps) explicitly. The vscode env runs @vscode/test-web
        # in browserType:'none' and launches that Chromium itself.
        env:
          PW_BROWSER: ${{ matrix.env == 'webkit' && 'webkit' || 'chromium' }}
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps "$PW_BROWSER"

      - name: Install CPO server runtime deps
        if: ${{ !startsWith(matrix.env, 'vscode') }}
        working-directory: ./code.pyret.org
        run: npm ci --ignore-scripts

      - name: Start CPO server
        if: ${{ !startsWith(matrix.env, 'vscode') }}
        working-directory: ./code.pyret.org
        env:
          BASE_URL: http://localhost:4999
          PORT: '4999'
          PYRET: http://localhost:4999/js/cpo-main.jarr
          POSTMESSAGE_ORIGIN: '*'
          NODE_ENV: development
          SESSION_SECRET: not-so-secret
          REDISCLOUD_URL: ''
          URL_FILE_MODE: all-remote
          IMAGE_PROXY_BYPASS: 'true'
          SHARED_FETCH_SERVER: https://code.pyret.org
          CURRENT_PYRET_RELEASE: ''
        run: |
          node src/run.js &
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:4999/editor && break; sleep 1; done
          curl -f http://localhost:4999/editor

      - name: Run ${{ matrix.env }}
        working-directory: ./browser-test
        env: { BASE_URL: 'http://localhost:4999' }
        run: node run.js --env=${{ matrix.env }}

  # The old-Safari authority. Runs the same specs as `cpo` against Apple's real
  # shipped WebKit/JavaScriptCore, which is the only tier that catches "JSC
  # hasn't implemented this" and "JSC gets this wrong" before a teacher on an old
  # iPad does. Needs macOS (simulators) but NOT nested virtualization, so it runs
  # on a stock GitHub-hosted runner with no secrets -- which also means it works
  # on pull requests from forks.
  test-ios-safari:
    needs: build
    runs-on: macos-14
    # Generous because a cold WebDriverAgent can eat one whole session attempt
    # before the warm retry succeeds; a warm run is far shorter.
    timeout-minutes: 75
    env:
      # Pin the OLDEST iOS worth supporting, not the newest available. macos-14
      # ships 17.0 / 17.2 / 17.4 / 17.5 runtimes preinstalled, and the bugs this
      # job exists to catch were fixed partway through that range:
      #   - iterator helpers (Iterator.prototype.map) landed in Safari 18.4
      #   - WebKit #223533 (a `var` redeclaring a parameter in an async function
      #     reads as undefined) was fixed in 17.4
      # Pinning 17.5 here would pass and prove nothing.
      IOS_VERSION: '17.0'
    steps:
      - uses: actions/checkout@v7
      # npm on a macOS runner is slow enough to dominate this job: `npm ci` for
      # code.pyret.org alone took 16 minutes uncached, against a ~2.5 minute
      # total for the same suite on ubuntu.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            browser-test/package-lock.json
            code.pyret.org/package-lock.json

      # The xcuitest driver download is another ~6 minutes.
      - name: Cache Appium drivers
        uses: actions/cache@v4
        with:
          path: ~/.appium
          key: appium-${{ runner.os }}-xcuitest-v1

      # WebDriverAgent's cold xcodebuild is ~75s of the session-creation budget,
      # and rebuilding it every run is pure waste. appium:derivedDataPath points
      # at this directory (see envs/ios-safari.js).
      - name: Cache WebDriverAgent build
        uses: actions/cache@v4
        with:
          path: ~/wda-derived-data
          key: wda-${{ runner.os }}-ios${{ env.IOS_VERSION }}-v1

      - name: Restore cpo build
        uses: actions/download-artifact@v4
        with:
          name: cpo-build
          path: code.pyret.org/build

      # Select the runtime by IDENTIFIER, not by .version. Two traps there:
      # tvOS 17.0 also reports version "17.0" (and sorts first), and the iOS
      # 17.0 runtime actually reports 17.0.1 -- so a version match picks the
      # wrong platform AND misses the right one. The identifier is exact.
      #
      # The device type is resolved from simctl rather than hardcoded, since
      # those identifiers change between Xcode releases. iPad (not iPhone) so
      # /editor gets the wide layout the CPO editor expects -- and it matches
      # what Bootstrap classrooms actually use.
      - name: Boot iOS ${{ env.IOS_VERSION }} simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          RUNTIMES=$(xcrun simctl list runtimes -j)
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          if ! echo "$RUNTIMES" | jq -e --arg id "$RUNTIME_ID" \
              '.runtimes[] | select(.identifier == $id and .isAvailable)' > /dev/null; then
            echo "runtime $RUNTIME_ID is not available on this image. iOS runtimes present:" >&2
            echo "$RUNTIMES" | jq -r '.runtimes[]
              | select(.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              | "  \(.identifier)  version=\(.version)  available=\(.isAvailable)"' >&2
            exit 1
          fi
          ACTUAL_VERSION=$(echo "$RUNTIMES" | jq -r --arg id "$RUNTIME_ID" \
            '.runtimes[] | select(.identifier == $id) | .version')
          DEVTYPE=$(echo "$RUNTIMES" | jq -r --arg id "$RUNTIME_ID" \
            '.runtimes[] | select(.identifier == $id) | (.supportedDeviceTypes // [])[]
             | select(.productFamily == "iPad") | .identifier' | head -1)
          if [ -z "$DEVTYPE" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r \
              '.devicetypes[] | select(.productFamily == "iPad") | .identifier' | head -1)
          fi
          if [ -z "$DEVTYPE" ]; then
            echo "could not resolve any iPad device type" >&2
            exit 1
          fi
          DEVNAME=$(xcrun simctl list devicetypes -j | jq -r --arg dt "$DEVTYPE" \
            '.devicetypes[] | select(.identifier == $dt) | .name')
          echo "runtime=$RUNTIME_ID (reports $ACTUAL_VERSION) device=$DEVNAME ($DEVTYPE)"
          UDID=$(xcrun simctl create pyret-safari "$DEVTYPE" "$RUNTIME_ID")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "IOS_DEVICE_NAME=$DEVNAME" >> "$GITHUB_ENV"
          # Appium matches on the version the runtime reports (17.0.1), not the pin.
          echo "IOS_ACTUAL_VERSION=$ACTUAL_VERSION" >> "$GITHUB_ENV"

      # Answer "is this actually an old engine?" BEFORE spending ten minutes on
      # Appium and WebDriverAgent. No driver involved -- it opens a page with
      # simctl and the page reports back -- so it still works when the driver
      # stack is broken, which is precisely when you want to know whether this
      # tier is worth debugging at all. Non-fatal: it reports either way, and
      # the in-session check in suite.test.js is what fails the build.
      - name: Probe the simulator's JS engine
        continue-on-error: true
        working-directory: ./browser-test
        run: node tools/simulator-engine-probe.js --udid="$SIM_UDID" --expect-old

      # webdriverio is installed --no-save on purpose: it is a macOS-only
      # dependency of one env, and putting it in package.json would make every
      # ubuntu matrix job install it. See browser-test/envs/ios-safari.js.
      - name: Install browser-test deps + Appium
        working-directory: ./browser-test
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm i --no-save webdriverio
          npm i -g appium
          appium driver install xcuitest

      - name: Start Appium
        working-directory: ./browser-test
        run: |
          set -euo pipefail
          appium --port 4723 --log-timestamp > appium.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:4723/status && break
            sleep 1
          done
          curl -f http://127.0.0.1:4723/status

      - name: Install CPO server runtime deps
        working-directory: ./code.pyret.org
        run: npm ci --ignore-scripts

      - name: Start CPO server
        working-directory: ./code.pyret.org
        env:
          BASE_URL: http://localhost:4999
          PORT: '4999'
          PYRET: http://localhost:4999/js/cpo-main.jarr
          POSTMESSAGE_ORIGIN: '*'
          NODE_ENV: development
          SESSION_SECRET: not-so-secret
          REDISCLOUD_URL: ''
          URL_FILE_MODE: all-remote
          IMAGE_PROXY_BYPASS: 'true'
          SHARED_FETCH_SERVER: https://code.pyret.org
          CURRENT_PYRET_RELEASE: ''
        run: |
          node src/run.js &
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:4999/editor && break; sleep 1; done
          curl -f http://localhost:4999/editor

      # The simulator shares the host network stack, so localhost:4999 resolves
      # to the CPO server above with no tunnel.
      # --suites=charts, not the full corpus: this tier exists to catch engine
      # bugs, and 236 specs took 13.5 minutes here (every eval is an HTTP round
      # trip through Appium) versus 2.5 minutes in Chromium. The engine fidelity
      # probes in suite.test.js's before() hook run regardless of --suites.
      - name: Run ios-safari
        working-directory: ./browser-test
        env:
          BASE_URL: 'http://localhost:4999'
          IOS_PLATFORM_VERSION: ${{ env.IOS_ACTUAL_VERSION }}
          WDA_DERIVED_DATA: /Users/runner/wda-derived-data
        run: node run.js --env=ios-safari --suites=charts

      - name: Upload Appium log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: browser-test/appium.log
          retention-days: 7
