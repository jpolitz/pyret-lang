name: browser-test (embed + vscode webviews)

# Runs code.pyret.org's editor assertions against five environments via the
# single Playwright runner in browser-test/:
#   cpo          -- the reference (/editor)
#   embed        -- the embed API's embedded instance
#   embed-static -- the pyret-embed library (embed/dist) driving the BUILT
#                   editor.embed.html artifact on a plain static server (no
#                   CPO server) -- the npm-consumer flow
#   vscode       -- the pyret-parley.cpo webview (headless VS Code for the Web)
#   vscode-ovsx  -- the same webview, but with its assets served the way Open VSX
#                   / the GitLab Web IDE serve them (text/plain + nosniff + size
#                   cap) -- the reproduction of pyret-parley issue #21
#
# Shape: build code.pyret.org + the extension ONCE, then fan out the five
# environments as a parallel matrix (each on its own runner, so chart rendering
# doesn't contend for CPU).
#
# Plus one `safari` job: the cpo env again, but in real Safari on a macOS runner
# (see the comment on that job for what it does and does not cover).

on:
  push:
    branches: [drydock, mainmast]
    tags-ignore:
      - automated*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build code.pyret.org web assets
        working-directory: ./code.pyret.org
        run: |
          ln -s ../lang pyret
          cd ../lang && npm install && make phaseA-deps
          cd ../code.pyret.org
          npm ci --ignore-scripts
          npm run build

      - name: Build vscode extension
        working-directory: ./vscode
        # --ignore-scripts: compiling needs only webpack/ts-loader, but a devDep
        # (@vscode/test-web -> @playwright/browser-chromium) would otherwise
        # download a ~150MB Chromium in postinstall, which the build doesn't use.
        run: |
          ln -sf ../code.pyret.org/build build
          npm ci --ignore-scripts
          npm run compile

      # /editor + the embed host page are served from code.pyret.org/build;
      # the vscode webview's assets are self-contained in vscode/dist.
      - uses: actions/upload-artifact@v4
        with:
          name: cpo-build
          path: code.pyret.org/build
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-dist
          path: vscode/dist
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        env: [cpo, embed, embed-static, vscode, vscode-ovsx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # cpo + embed + embed-static need the CPO build; only cpo + embed need
      # the CPO *server* (embed-static serves the built artifact itself).
      - name: Restore cpo build
        if: ${{ !startsWith(matrix.env, 'vscode') }}
        uses: actions/download-artifact@v4
        with:
          name: cpo-build
          path: code.pyret.org/build
      - name: Restore vscode extension
        if: ${{ startsWith(matrix.env, 'vscode') }}
        uses: actions/download-artifact@v4
        with:
          name: vscode-dist
          path: vscode/dist

      - name: Install browser-test deps + Chromium
        working-directory: ./browser-test
        # --ignore-scripts skips the implicit @playwright/browser-chromium and
        # playwright browser downloads from npm ci; we then install exactly one
        # Chromium (with OS deps) explicitly. The vscode env runs @vscode/test-web
        # in browserType:'none' and launches that Chromium itself.
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build pyret-embed library
        if: ${{ matrix.env == 'embed-static' }}
        working-directory: ./embed
        # --ignore-scripts: the code.pyret.org file: devDep would otherwise try
        # to build all of CPO; webpack only needs embed/src + its own deps.
        run: |
          npm ci --ignore-scripts
          npx webpack

      - name: Install CPO server runtime deps
        if: ${{ matrix.env == 'cpo' || matrix.env == 'embed' }}
        working-directory: ./code.pyret.org
        run: npm ci --ignore-scripts

      - name: Start CPO server
        if: ${{ matrix.env == 'cpo' || matrix.env == 'embed' }}
        working-directory: ./code.pyret.org
        env:
          BASE_URL: http://localhost:4999
          PORT: '4999'
          PYRET: http://localhost:4999/js/cpo-main.jarr
          POSTMESSAGE_ORIGIN: '*'
          NODE_ENV: development
          SESSION_SECRET: not-so-secret
          REDISCLOUD_URL: ''
          URL_FILE_MODE: all-remote
          IMAGE_PROXY_BYPASS: 'true'
          SHARED_FETCH_SERVER: https://code.pyret.org
          CURRENT_PYRET_RELEASE: ''
        run: |
          node src/run.js &
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:4999/editor && break; sleep 1; done
          curl -f http://localhost:4999/editor

      - name: Run ${{ matrix.env }}
        working-directory: ./browser-test
        # Only cpo/embed are meant to test a live running CPO server, others
        # only use static files.
        env:
          BASE_URL: ${{ (matrix.env == 'cpo' || matrix.env == 'embed') && 'http://localhost:4999' || '' }}
        run: node run.js --env=${{ matrix.env }}

  # The cpo specs in REAL Safari (PYRET_BROWSER=safari -> shared/webdriver.js).
  #
  # What this covers: Apple's actual browser, which nothing else in CI touches.
  # Playwright has no way to drive Safari, and its bundled "webkit" is a separate
  # WebKit build, not the shipped browser.
  #
  # What it does NOT cover: old Safari. macos-15 ships Safari 26.x, and the
  # runner images track Safari forward regardless of the OS pin -- macos-14
  # (Sonoma) also carries 26.x today. So this cannot catch the class of bug that
  # motivated the WebDriver backend (e.g. 2edad1883, iterator helpers missing in
  # Safari 17). That still needs a pinned VM; see browser-test/README.md.
  #
  # cpo only: it is the one env the WebDriver backend supports -- same-origin, no
  # init script, editor in the main frame.
  safari:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    # Soft rollout: Safari automation on a hosted runner is new here, and a flaky
    # WebKit job should not block merges before we have any history. Drop this
    # once it has been reliably green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore cpo build
        uses: actions/download-artifact@v4
        with:
          name: cpo-build
          path: code.pyret.org/build

      - name: Install browser-test deps
        working-directory: ./browser-test
        # No `playwright install` here: the WebDriver backend talks HTTP to
        # safaridriver and needs no browser binary. The playwright *package* is
        # still installed because shared/browser.js requires it for the chromium
        # path -- npm ci --ignore-scripts gets the package without the ~150MB
        # browser download.
        run: npm ci --ignore-scripts

      - name: Install CPO server runtime deps
        working-directory: ./code.pyret.org
        run: npm ci --ignore-scripts

      - name: Start CPO server
        working-directory: ./code.pyret.org
        env:
          BASE_URL: http://localhost:4999
          PORT: '4999'
          PYRET: http://localhost:4999/js/cpo-main.jarr
          POSTMESSAGE_ORIGIN: '*'
          NODE_ENV: development
          SESSION_SECRET: not-so-secret
          REDISCLOUD_URL: ''
          URL_FILE_MODE: all-remote
          IMAGE_PROXY_BYPASS: 'true'
          SHARED_FETCH_SERVER: https://code.pyret.org
          CURRENT_PYRET_RELEASE: ''
        run: |
          node src/run.js &
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:4999/editor && break; sleep 1; done
          curl -f http://localhost:4999/editor

      - name: Enable and start safaridriver
        # --enable flips "Allow Remote Automation"; it needs root and exits
        # without starting the service. Safari has no headless mode, so this
        # relies on the runner's GUI login session.
        run: |
          safaridriver --version
          sudo safaridriver --enable
          safaridriver -p 4444 &
          for _ in $(seq 1 15); do curl -fs -o /dev/null http://127.0.0.1:4444/status && break; sleep 1; done
          curl -fs http://127.0.0.1:4444/status

      - name: Run cpo in Safari
        working-directory: ./browser-test
        # Same machine as the server, so no ssh tunnel and no PYRET_STATIC_HOST
        # (both of which the VM path needs). SAFARI_EXPECT_VERSION is deliberately
        # unset: the runner's Safari floats, and the run logs which one answered
        # ("browser: Safari <v> ... via <url>").
        env:
          BASE_URL: http://localhost:4999
          PYRET_BROWSER: safari
          SAFARI_WEBDRIVER_URL: http://127.0.0.1:4444
        run: node run.js --env=cpo
